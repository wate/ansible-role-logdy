# code: language=ansible
---
- name: Set Install version variable
  when: logdy_version == 'latest'
  block:
    - name: Set Github API request header
      ansible.builtin.set_fact:
        github_api_request_headers:
          Accept: application/vnd.github+json
    - name: Merge Github API Authorization request header
      ansible.builtin.set_fact:
        github_api_request_headers: "{{ github_api_request_headers | combine(merge_request_header) }}"
      vars:
        merge_request_header:
          Authorization: Bearer {{ lookup('env', 'GITHUB_TOKEN') }}
      when: lookup('env', 'GITHUB_TOKEN') | length > 0
    - name: Get latest release
      ansible.builtin.uri:
        url: https://api.github.com/repos/{{ logdy_repo }}/releases/latest
        headers: "{{ github_api_request_headers }}"
      register: latest_releases
    - name: Set package version variable
      ansible.builtin.set_fact:
        logdy_version: "{{ latest_releases.json.tag_name }}"
- name: Set asset file variable
  ansible.builtin.set_fact:
    logdy_download_file: logdy_{{ ansible_facts['system'] | lower }}_{{ arch_type_maps[ansible_facts['architecture']] }}
  vars:
    arch_type_maps:
      x86_64: amd64
      aarch64: arm64
- name: Install logdy
  ansible.builtin.get_url:
    url: https://github.com/{{ logdy_repo }}/releases/download/{{ logdy_version }}/{{ logdy_download_file }}
    dest: /usr/local/bin/logdy
    mode: "0755"
  notify: Restart logdy
