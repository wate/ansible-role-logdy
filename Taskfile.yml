# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'
tasks:
  notify:
    internal: true
    silent: true
    cmds:
      - afplay /System/Library/Sounds/Glass.aiff
  default:
    desc: Run Molecule tests for default scenario
    cmds:
      - molecule test
      - task: notify
  disable-autostart:
    desc: Run Molecule tests for the disable-autostart scenario
    cmds:
      - molecule test -s disable-autostart --destroy=always
      - task: notify
  all:
    desc: Run Molecule tests for all scenarios (sequential)
    cmds:
      - task: default
      - task: disable-autostart
