# code: language=ansible
---
- name: Verify
  hosts: all
  gather_facts: false
  become: true
  vars:
    expected_logdy_user: logdy
    expected_logdy_group: logdy
  tasks:
    # Collect runtime facts used by assertions.
    - name: Load role default variables
      ansible.builtin.include_vars:
        file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
    - name: Gather service facts
      ansible.builtin.service_facts:
    - name: Gather listen ports facts
      community.general.listen_ports_facts:
    - name: Gather user facts
      ansible.builtin.getent:
        database: passwd
    - name: Gather group facts
      ansible.builtin.getent:
        database: group
    - name: Set assert variables
      ansible.builtin.set_fact:
        registered_users: "{{ ansible_facts.getent_passwd }}"
        registered_groups: "{{ ansible_facts.getent_group }}"
        listen_tcp_ports: "{{ ansible_facts.tcp_listen | default([]) | map(attribute='port') | unique | sort | list }}"
    - name: Assert logdy group exists
      ansible.builtin.assert:
        that:
          - registered_groups[expected_logdy_group] is defined
    - name: Assert logdy user exists
      ansible.builtin.assert:
        that:
          - registered_users[expected_logdy_user] is defined
    - name: Check logdy binary
      ansible.builtin.stat:
        path: /usr/local/bin/logdy
      register: logdy_binary
    - name: Assert logdy binary is installed and executable
      ansible.builtin.assert:
        that:
          - logdy_binary.stat.exists
          - logdy_binary.stat.isreg
          - logdy_binary.stat.executable
    - name: Check environment file
      ansible.builtin.stat:
        path: /etc/default/logdy
      register: logdy_env_file
    - name: Assert environment file exists
      ansible.builtin.assert:
        that:
          - logdy_env_file.stat.exists
          - logdy_env_file.stat.isreg
    - name: Check systemd unit file
      ansible.builtin.stat:
        path: /lib/systemd/system/logdy.service
      register: logdy_service_unit
    - name: Assert systemd unit file exists
      ansible.builtin.assert:
        that:
          - logdy_service_unit.stat.exists
          - logdy_service_unit.stat.isreg
    - name: Read systemd unit file
      ansible.builtin.slurp:
        path: /lib/systemd/system/logdy.service
      register: logdy_service_unit_content
    - name: Assert systemd unit file content
      ansible.builtin.assert:
        that:
          - "'EnvironmentFile=/etc/default/logdy' in (logdy_service_unit_content.content | b64decode)"
          - "'ExecStart=/usr/local/bin/logdy' in (logdy_service_unit_content.content | b64decode)"
          - "('User=' ~ expected_logdy_user) in (logdy_service_unit_content.content | b64decode)"
          - "('Group=' ~ expected_logdy_group) in (logdy_service_unit_content.content | b64decode)"
    - name: Assert logdy service is enabled and running
      ansible.builtin.assert:
        that:
          - ansible_facts.services['logdy.service'] is defined
          - ansible_facts.services['logdy.service'].status == 'enabled'
          - ansible_facts.services['logdy.service'].state == 'running'
    - name: Assert logdy listen ports are open
      ansible.builtin.assert:
        that:
          - logdy_listen_port in listen_tcp_ports
          - logdy_web_port in listen_tcp_ports
